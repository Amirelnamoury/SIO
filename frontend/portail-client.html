<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace client</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="devis-public.css">
<link rel="stylesheet" href="portail-client.css">
</head>
<body class="devis-public-body">

<div class="devis-public-wrap">
  <div id="portail-content" class="devis-public-card">
    <div class="empty-state">Chargement de votre espace...</div>
  </div>
  <p class="devis-public-footer">Espace client fourni par <strong>Suite Artisan</strong></p>
</div>

<script>
const API_BASE = "http://localhost:8000";

function escapeHtml(value) {
  if (value === null || value === undefined) return "";
  return String(value)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function fmtEuro(n) {
  if (n === null || n === undefined) return "-";
  return new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" }).format(n);
}
function fmtDate(iso) {
  if (!iso) return "-";
  return new Date(iso).toLocaleDateString("fr-FR");
}
function fmtDateTime(iso) {
  if (!iso) return "-";
  return new Date(iso).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
}

const token = new URLSearchParams(window.location.search).get("t");
const contentEl = document.getElementById("portail-content");

const DEVIS_STATUT_LABELS = {
  nouveau: "Nouveau", envoye: "Envoye", consulte: "Consulte",
  relance_j3: "En attente de retour", relance_j7: "En attente de retour", relance_j15: "En attente de retour",
  signe: "Accepte", perdu: "Perdu", expire: "Expire",
};
const FACTURE_STATUT_LABELS = {
  envoyee: "A regler", partiellement_payee: "Partiellement reglee", payee: "Reglee",
  en_retard: "En retard", annulee: "Annulee",
};
const CHANTIER_STATUT_LABELS = {
  a_preparer: "En preparation", planifie: "Planifie", en_cours: "En cours",
  en_pause: "En pause", termine: "Termine", facture: "Facture", paye: "Solde",
};

function devisRowHtml(d) {
  const badge = d.statut === "signe" ? "badge-green" : (d.statut === "perdu" || d.statut === "expire") ? "badge-gray" : "badge-blue";
  return `
  <a class="portail-row" href="devis-public.html?t=${escapeHtml(d.token || "")}">
    <div><div class="portail-row-title">${escapeHtml(d.titre || d.numero || "Devis")}</div><div class="section-hint" style="margin:0;">${d.numero ? escapeHtml(d.numero) : ""}</div></div>
    <div class="portail-row-right"><strong>${fmtEuro(d.montant_ttc)}</strong><span class="badge ${badge}">${DEVIS_STATUT_LABELS[d.statut] || d.statut}</span></div>
  </a>`;
}

function factureRowHtml(f) {
  const badge = f.statut === "payee" ? "badge-green" : f.est_en_retard ? "badge-red" : "badge-blue";
  return `
  <a class="portail-row" href="facture-public.html?t=${escapeHtml(f.token || "")}">
    <div><div class="portail-row-title">${escapeHtml(f.numero)}</div><div class="section-hint" style="margin:0;">Echeance : ${fmtDate(f.date_echeance)}</div></div>
    <div class="portail-row-right"><strong>${fmtEuro(f.montant_ttc)}</strong><span class="badge ${badge}">${FACTURE_STATUT_LABELS[f.statut] || f.statut}</span></div>
  </a>`;
}

function chantierCardHtml(c) {
  const photosHtml = c.photos.length
    ? `<div class="portail-photo-grid">${c.photos.map((p) => `<img src="${API_BASE}/pub/portail/${token}/photos/${p.id}" alt="${escapeHtml(p.nom)}" loading="lazy">`).join("")}</div>`
    : "";
  const progressionHtml = c.progression !== null && c.progression !== undefined
    ? `<div class="portail-progression"><div class="portail-progression-bar"><div style="width:${c.progression}%;"></div></div><span>${c.progression}%</span></div>`
    : "";
  return `
  <div class="portail-chantier">
    <div class="portail-row-title">${escapeHtml(c.titre)}</div>
    <div class="section-hint" style="margin:2px 0 8px;">
      ${CHANTIER_STATUT_LABELS[c.statut] || c.statut}
      ${c.date_debut ? " · Debut : " + fmtDate(c.date_debut) : ""}
      ${c.date_fin_prevue ? " · Fin prevue : " + fmtDate(c.date_fin_prevue) : ""}
    </div>
    ${progressionHtml}
    ${photosHtml}
  </div>`;
}

function messageItemHtml(m) {
  return `<div class="portail-message ${m.expediteur === "client" ? "is-mine" : ""}">
    <div>${escapeHtml(m.texte)}</div>
    <div class="portail-message-date">${fmtDateTime(m.created_at)}</div>
  </div>`;
}

function sectionHtml(titre, innerHtml, emptyText) {
  return `<div class="portail-section"><h3>${titre}</h3>${innerHtml || `<div class="empty-state">${emptyText}</div>`}</div>`;
}

function render(p) {
  contentEl.innerHTML = `
    <div class="devis-public-header">
      <div>
        <div class="devis-public-artisan">${escapeHtml(p.artisan_nom_entreprise)}</div>
        <div class="section-hint" style="margin:2px 0 0;">
          ${p.artisan_telephone ? escapeHtml(p.artisan_telephone) + " · " : ""}${escapeHtml(p.artisan_email || "")}
        </div>
      </div>
    </div>
    <h1>Bonjour ${escapeHtml(p.client_nom)}</h1>
    <p class="section-hint">Retrouvez ici vos devis, factures, chantiers et echanges avec ${escapeHtml(p.artisan_nom_entreprise)}.</p>

    ${sectionHtml("Vos chantiers", p.chantiers.map(chantierCardHtml).join(""), "Aucun chantier pour le moment.")}
    ${sectionHtml("Vos devis", p.devis.map(devisRowHtml).join(""), "Aucun devis pour le moment.")}
    ${sectionHtml("Vos factures", p.factures.map(factureRowHtml).join(""), "Aucune facture pour le moment.")}

    <div class="portail-section">
      <h3>Messages</h3>
      <div id="messages-list">${p.messages.length ? p.messages.map(messageItemHtml).join("") : '<div class="empty-state">Aucun message pour le moment.</div>'}</div>
      <form id="message-form" class="portail-message-form">
        <textarea id="message-texte" placeholder="Ecrire un message..." required></textarea>
        <p class="field-error" id="message-error" hidden></p>
        <button type="submit" class="btn-primary">Envoyer</button>
      </form>
    </div>
  `;

  document.getElementById("message-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("message-error");
    errorBox.hidden = true;
    const texte = document.getElementById("message-texte").value.trim();
    if (!texte) return;
    const submitBtn = e.target.querySelector("button[type=submit]");
    submitBtn.disabled = true;
    try {
      const res = await fetch(`${API_BASE}/pub/portail/${token}/messages`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ texte }),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => null);
        throw new Error((data && data.detail) || "Impossible d'envoyer le message.");
      }
      await load();
    } catch (err) {
      errorBox.hidden = false;
      errorBox.textContent = err.message;
      submitBtn.disabled = false;
    }
  });
}

async function load() {
  if (!token) {
    contentEl.innerHTML = '<div class="empty-state">Lien d\'espace client invalide.</div>';
    return;
  }
  try {
    const res = await fetch(`${API_BASE}/pub/portail/${token}`);
    if (!res.ok) {
      contentEl.innerHTML = '<div class="empty-state">Cet espace est introuvable ou le lien a expire. Demandez un nouveau lien a votre artisan.</div>';
      return;
    }
    render(await res.json());
  } catch (err) {
    contentEl.innerHTML = '<div class="empty-state">Impossible de contacter le serveur. Verifiez votre connexion.</div>';
  }
}

load();
</script>
</body>
</html>

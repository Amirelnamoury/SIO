<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion | Admin Suite Artisan</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-panel">
      <div class="brand-mark">SA</div>
      <p class="brand-kicker">ADMIN SUITE ARTISAN</p>
      <h1>Centre d'exploitation</h1>
      <form id="admin-login-form" class="login-form">
        <label>Email<input id="login-email" name="email" type="email" autocomplete="username" required></label>
        <label>Mot de passe<input id="login-password" name="password" type="password" autocomplete="current-password" required></label>
        <button class="button button-primary button-wide" type="submit">Se connecter</button>
        <p id="login-error" class="form-error" role="alert"></p>
      </form>
    </section>
  </main>
  <script src="admin.js"></script>
</body>
</html>

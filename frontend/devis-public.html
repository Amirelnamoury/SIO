<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="devis-public.css">
</head>
<body class="devis-public-body">

<div class="devis-public-wrap">
  <div id="devis-public-content" class="devis-public-card">
    <div class="empty-state">Chargement du devis...</div>
  </div>
  <p class="devis-public-footer">Devis généré et transmis via <strong>Suite Artisan</strong></p>
</div>

<script src="env.js"></script>
<script src="config.js"></script>
<script>
const API_BASE = window.SUITE_ARTISAN_API_BASE;

function escapeHtml(value) {
  if (value === null || value === undefined) return "";
  return String(value)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function fmtEuro(n) {
  if (n === null || n === undefined) return "-";
  return new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" }).format(n);
}
function fmtDate(iso) {
  if (!iso) return "-";
  return new Date(iso).toLocaleDateString("fr-FR");
}

const token = new URLSearchParams(window.location.search).get("t");
const contentEl = document.getElementById("devis-public-content");

const STATUT_LABELS = {
  nouveau: "Nouveau", envoye: "Envoyé", consulte: "Consulté",
  relance_j3: "En attente de retour", relance_j7: "En attente de retour", relance_j15: "En attente de retour",
  signe: "Accepté", perdu: "Perdu", expire: "Expiré",
};

function lignesTableHtml(lignes) {
  return `
  <table class="devis-public-table">
    <thead><tr><th>Description</th><th>Qté</th><th>Unité</th><th>PU HT</th><th>Total HT</th></tr></thead>
    <tbody>
      ${lignes.map((l) => `<tr>
        <td>${escapeHtml(l.description)}</td>
        <td>${l.quantite}</td>
        <td>${escapeHtml(l.unite)}</td>
        <td>${fmtEuro(l.prix_unitaire_ht)}</td>
        <td>${fmtEuro(l.total_ht)}</td>
      </tr>`).join("")}
    </tbody>
  </table>`;
}

function totauxHtml(d) {
  const rows = [];
  if (d.remise_montant) {
    rows.push(["Sous-total HT", fmtEuro(d.montant_ht_brut)]);
    rows.push([`Remise (${d.remise_pourcentage}%)`, "-" + fmtEuro(d.remise_montant)]);
  }
  rows.push(["Total HT", fmtEuro(d.montant_ht)]);
  rows.push([`TVA (${d.taux_tva}%)`, fmtEuro((d.montant_ttc || 0) - (d.montant_ht || 0))]);
  rows.push(["Total TTC", fmtEuro(d.montant_ttc)]);
  // Le montant est bien celui que le client paiera : la facture d'acompte que
  // l'artisan generera porte `montant_ht x pct` plus sa TVA, ce qui revient au
  // meme resultat. Mais rien ne disait qu'il s'agissait d'un TTC, tandis que
  // l'application affichait le HT de son cote sans le dire non plus : le meme
  // acompte du meme devis apparaissait sous deux montants differents, l'un
  // chez l'artisan, l'autre chez son client. La mention leve l'ambiguite.
  rows.push([`Acompte à la commande (${d.acompte_pourcentage}%), TTC`, fmtEuro((d.montant_ttc || 0) * d.acompte_pourcentage / 100)]);
  return `<div class="devis-public-totaux">
    ${rows.map(([l, v], i) => `<div class="devis-public-total-row ${i === rows.length - 2 ? "is-total" : ""}"><span>${l}</span><strong>${v}</strong></div>`).join("")}
  </div>`;
}

function renderDevis(d) {
  const statutLabel = STATUT_LABELS[d.statut] || d.statut;
  let statusBanner = "";
  let actionZone = "";

  if (d.statut === "signe") {
    statusBanner = `<div class="devis-public-banner is-success">
      <strong>Devis accepté</strong> le ${fmtDate(d.date_signature)}${d.nom_signataire ? " par " + escapeHtml(d.nom_signataire) : ""}.
    </div>`;
  } else if (d.statut === "perdu" || d.statut === "expire") {
    statusBanner = `<div class="devis-public-banner is-muted">Ce devis n'est plus disponible (${statutLabel.toLowerCase()}).</div>`;
  } else {
    actionZone = `
    <div class="devis-public-accept">
      <h3>Vous êtes d'accord avec ce devis ?</h3>
      <p class="section-hint">En acceptant, vous confirmez avoir pris connaissance du devis ci-dessus et donnez votre accord ("bon pour accord").</p>
      <form id="accept-form">
        <label for="nom-signataire">Votre nom complet</label>
        <input type="text" id="nom-signataire" required placeholder="Prénom Nom">
        <p class="field-error" id="accept-error" hidden></p>
        <button type="submit" class="btn-primary" style="width:100%;">Accepter ce devis</button>
      </form>
    </div>`;
  }

  contentEl.innerHTML = `
    <div class="devis-public-header">
      <div>
        <div class="devis-public-artisan">${escapeHtml(d.artisan_nom_entreprise)}</div>
        <div class="section-hint" style="margin:2px 0 0;">
          ${d.artisan_telephone ? escapeHtml(d.artisan_telephone) + " · " : ""}${escapeHtml(d.artisan_email)}
        </div>
      </div>
      <span class="badge ${d.statut === "signe" ? "badge-green" : "badge-gray"}">${statutLabel}</span>
    </div>

    ${statusBanner}

    <h1>${escapeHtml(d.titre || "Devis")} ${d.numero ? `<span class="devis-public-numero">${escapeHtml(d.numero)}</span>` : ""}</h1>
    <p class="section-hint">Devis établi pour ${escapeHtml(d.client_nom)}</p>
    ${d.description ? `<p>${escapeHtml(d.description)}</p>` : ""}

    ${lignesTableHtml(d.lignes)}
    ${totauxHtml(d)}

    ${actionZone}

    <p class="devis-public-mentions">
      Acompte de ${d.acompte_pourcentage}% à la signature, solde exigible à la fin des travaux.
      ${d.artisan_assurance_decennale_nom ? `Entreprise couverte par une assurance de responsabilité civile décennale souscrite auprès de ${escapeHtml(d.artisan_assurance_decennale_nom)}.` : ""}
      ${d.artisan_siret ? `SIRET : ${escapeHtml(d.artisan_siret)}.` : ""}
    </p>
  `;

  const form = document.getElementById("accept-form");
  if (form) {
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("accept-error");
      errorBox.hidden = true;
      const submitBtn = form.querySelector("button[type=submit]");
      submitBtn.disabled = true;
      try {
        const res = await fetch(`${API_BASE}/pub/devis/${token}/accepter`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nom_signataire: document.getElementById("nom-signataire").value }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => null);
          throw new Error((data && data.detail) || "Impossible d'accepter ce devis.");
        }
        const updated = await res.json();
        renderDevis(updated);
      } catch (err) {
        errorBox.hidden = false;
        errorBox.textContent = err.message;
        submitBtn.disabled = false;
      }
    });
  }
}

async function load() {
  if (!token) {
    contentEl.innerHTML = '<div class="empty-state">Lien de devis invalide.</div>';
    return;
  }
  let donnees;
  try {
    const res = await fetch(`${API_BASE}/pub/devis/${token}`);
    if (!res.ok) {
      contentEl.innerHTML = '<div class="empty-state">Ce devis est introuvable. Vérifiez le lien reçu.</div>';
      return;
    }
    donnees = await res.json();
  } catch (err) {
    contentEl.innerHTML = '<div class="empty-state">Impossible de contacter le serveur. Vérifiez votre connexion.</div>';
    return;
  }
  // Le rendu est HORS du try reseau. Il etait dedans : la moindre erreur
  // d'affichage - un champ absent, une valeur inattendue - etait annoncee au
  // client de l'artisan comme une panne de sa connexion. Il verifiait son
  // wifi pendant que le devis, lui, etait bien arrive.
  try {
    renderDevis(donnees);
  } catch (err) {
    contentEl.innerHTML = '<div class="empty-state">Ce devis n\'a pas pu s\'afficher. Prévenez votre artisan, il pourra vous le renvoyer.</div>';
  }
}

load();
</script>
</body>
</html>
